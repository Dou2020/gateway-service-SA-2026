# Pruebas y despliegue del api-gateway.
#
#   push / PR a dev o main  → pruebas
#   push a main (o a mano)  → pruebas → despliegue en la VM por SSH
#
# El despliegue sube el código del repositorio a la VM y la imagen se compila allá con docker compose up
# --build, con el mismo Dockerfile y el mismo compose de desarrollo: sin registro de imágenes ni credenciales
# de GHCR en la VM. El costo es que Maven corre en el servidor (README raíz, "Primer despliegue": 4 GB de
# swap). Volver atrás: "Re-run jobs" sobre el job desplegar de una corrida vieja sube y compila ese commit.
# Los secrets viven en el environment "produccion" (README raíz, "Despliegue a producción" → "Pipeline del
# gateway"; la lista, en .env.prod).

name: ci-cd

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers levanta su Redis con el Docker que trae ubuntu-latest; los servicios de destino son falsos
      - run: mvn -B -ntp test

  desplegar:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: produccion
    # Un despliegue no cancela al que está en curso: cortarlo a mitad de un "up" deja el contenedor a medias
    concurrency:
      group: despliegue-api-gateway
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/transporte/api-gateway' }}
    steps:
      - uses: actions/checkout@v4

      # Llave .pem sin huella fija del servidor: accept-new guarda la que presente la VM en la primera conexión
      # del job y exige esa misma en las siguientes. Como el runner arranca sin known_hosts, no protege contra
      # quien se haga pasar por la VM desde la primera conexión
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vm.pem
          chmod 600 ~/.ssh/vm.pem
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/vm.pem
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      # La red transporte y Redis son del proyecto infra, que se levanta una vez a mano en la VM; sin ellos el
      # gateway no queda healthy y el error de compose no dice por qué
      - name: Revisar la VM
        run: |
          # shellcheck disable=SC2029  # $DEPLOY_DIR y compañía se expanden en el runner a propósito
          ssh vm "mkdir -p '$DEPLOY_DIR' && docker network inspect transporte >/dev/null" || {
            echo "::error::Falta la red transporte en la VM: levantar antes el proyecto infra (docker compose up -d --wait en la carpeta de infra)"
            exit 1
          }

      # Se vacía la carpeta antes de descomprimir para que un archivo borrado en el repo no quede en la VM. El
      # contenedor que corre no se toca: sigue con su imagen hasta que el up de abajo lo reemplace. Sin .git
      # (la VM no necesita historial) ni target/ (el Dockerfile compila desde src/)
      - name: Subir el proyecto
        run: |
          # shellcheck disable=SC2029  # $DEPLOY_DIR se expande en el runner a propósito
          tar -czf - --exclude=./.git --exclude=./target . \
            | ssh vm "set -e; find '$DEPLOY_DIR' -mindepth 1 -delete; tar -xzf - -C '$DEPLOY_DIR'"

      - name: Escribir el .env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          PROXIES_CONFIABLES: ${{ vars.PROXIES_CONFIABLES || '0' }}
          GATEWAY_BIND: ${{ vars.GATEWAY_BIND }}
        run: |
          # Por stdin: los secrets no quedan en la línea de comandos de la VM (ps, historial) ni en el log
          # shellcheck disable=SC2029  # $DEPLOY_DIR se expande en el runner a propósito
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
            printf 'PROXIES_CONFIABLES=%s\n' "$PROXIES_CONFIABLES"
            if [ -n "$GATEWAY_BIND" ]; then printf 'GATEWAY_BIND=%s\n' "$GATEWAY_BIND"; fi
          } | ssh vm "umask 077 && cat > '$DEPLOY_DIR/.env'"

      # Compila la imagen en la VM y reemplaza el contenedor. --wait hace fallar el job si no queda healthy (el
      # health de actuator incluye Redis; el healthcheck tarda hasta ~3 min en rendirse). La compilación con
      # Maven se suma a ese tiempo, por eso el timeout del job. prune borra la imagen anterior, que quedó sin tag
      - name: Compilar y levantar en la VM
        timeout-minutes: 20
        run: |
          # shellcheck disable=SC2029  # $DEPLOY_DIR se expande en el runner a propósito
          ssh vm "set -e
            cd '$DEPLOY_DIR'
            docker compose up -d --build --wait --wait-timeout 300
            docker image prune -f"

      - name: Comprobar health
        run: ssh vm "curl -fsS localhost:8080/actuator/health"
